name: Build PS4 PKG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-ps4-pkg:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download and Setup PS4 Packaging Tools
        shell: pwsh
        run: |
          Write-Host "Downloading PS4 packaging tools..."
          Invoke-WebRequest -Uri "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87/archive/refs/heads/main.zip" -OutFile "ps4_tools.zip"
          Expand-Archive -Path "ps4_tools.zip" -DestinationPath "ps4_tools" -Force
          try {
            Invoke-WebRequest -Uri "https://github.com/pearlxcore/ps4-pkg-tool/releases/latest/download/ps4-pkg-tool-win64.zip" -OutFile "ps4-pkg-tool.zip"
            Expand-Archive -Path "ps4-pkg-tool.zip" -DestinationPath "ps4-pkg-tool" -Force
          } catch {
            Write-Warning "Could not download ps4-pkg-tool from GitHub releases. Continuing with available tools."
          }
          $exeFiles = @()
          $exeFiles += Get-ChildItem -Path "ps4_tools","ps4-pkg-tool" -Filter "orbis-pub-cmd.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $exeFiles += Get-ChildItem -Path "ps4_tools","ps4-pkg-tool" -Filter "ps4-pkg-tool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($exeFile in $exeFiles) {
            if ($exeFile) {
              $toolsPath = $exeFile.DirectoryName
              Write-Host "Found tool at: $toolsPath"
              Add-Content -Path $env:GITHUB_PATH -Value $toolsPath
            }
          }
          if (-not ($exeFiles | Where-Object { $_ })) {
            Write-Warning "No PS4 packaging executables were found in the downloaded tools."
          }

      - name: Build PS4 package with create_pkg_builder.py
        working-directory: source
        shell: pwsh
        run: |
          if (-not (Test-Path "create_pkg_builder.py")) {
            Write-Error "الملف create_pkg_builder.py غير موجود في مسار source."
            exit 1
          }
          python .\create_pkg_builder.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'PS4 PKG build failed'
            exit 1
          }
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify generated PS4 package exists
        working-directory: source
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path build\* -Include *.pkg,*.zip -ErrorAction SilentlyContinue
          if (-not $pkg) {
            Write-Error 'Generated PS4 package or archive is missing'
            exit 0
          }

      - name: Upload PS4 package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPKGi-PS4-PKG
          path: source/build/FPKGi_v2.0.0_PS4.*
          if-no-files-found: error
