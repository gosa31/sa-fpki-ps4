name: .NET Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a Windows application, use windows-latest. For a Linux application, use ubuntu-latest.

    env:
      Solution_Name: FPKGi.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Setup Python for packaging scripts
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Download and Setup PS4 Fake PKG Tools
    - name: Download and Setup PS4 Packaging Tools
      shell: pwsh
      run: |
        Write-Host "Downloading PS4 packaging tools..."
        Invoke-WebRequest -Uri "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87/archive/refs/heads/main.zip" -OutFile "ps4_tools.zip"
        Expand-Archive -Path "ps4_tools.zip" -DestinationPath "ps4_tools" -Force
        try {
          Invoke-WebRequest -Uri "https://github.com/pearlxcore/ps4-pkg-tool/releases/latest/download/ps4-pkg-tool-win64.zip" -OutFile "ps4-pkg-tool.zip"
          Expand-Archive -Path "ps4-pkg-tool.zip" -DestinationPath "ps4-pkg-tool" -Force
        } catch {
          Write-Warning "Could not download ps4-pkg-tool from GitHub releases. Continuing with available tools."
        }
        $exeFiles = @()
        $exeFiles += Get-ChildItem -Path "ps4_tools","ps4-pkg-tool" -Filter "orbis-pub-cmd.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $exeFiles += Get-ChildItem -Path "ps4_tools","ps4-pkg-tool" -Filter "ps4-pkg-tool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        foreach ($exeFile in $exeFiles) {
          if ($exeFile) {
            $toolsPath = $exeFile.DirectoryName
            Write-Host "Found tool at: $toolsPath"
            Add-Content -Path $env:GITHUB_PATH -Value $toolsPath
          }
        }
        if (-not ($exeFiles | Where-Object { $_ })) {
          Write-Warning "No PS4 packaging executables were found in the downloaded tools."
        }

    # Build Real PS4 PKG
    - name: Build Real PS4 PKG
      working-directory: source
      shell: pwsh
      run: |
        Write-Host "Building real PS4 PKG package..."
        if (Test-Path "create_pkg_builder.py") {
          python .\create_pkg_builder.py
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            Write-Host "✓ Real PKG created successfully"
          } else {
            Write-Error "Failed to create PKG"
            exit 1
          }
        } else {
          Write-Error "create_pkg_builder.py not found"
          exit 1
        }
      env:
        PYTHONIOENCODING: utf-8

    # Restore the application (for non-Unity projects)
    - name: Restore solution
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      continue-on-error: true
      env:
        Configuration: ${{ matrix.configuration }}

    # Upload PS4 package artifacts
    - name: Upload PS4 Package Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: PS4-Packages-${{ matrix.configuration }}
        path: |
          source/build/**/*.pkg
          source/build/**/*.zip
          source/BUILD/**/*.pkg
          source/BUILD/**/*.zip
          source/Builds/**/*.pkg
          source/Builds/**/*.zip
        if-no-files-found: warn